on:
  pull_request:
    # Commented paths to avoid skipping required workflow
    # See https://github.community/t/feature-request-conditional-required-checks/16761
    # paths:
    #   - .github/workflows/integration-tests.yml
    #   - "**/*.go"
    #   - "chain/**"
    #   - "cmd/**"
    #   - "dot/**"
    #   - "internal/**"
    #   - "lib/**"
    #   - "pkg/**"
    #   - "tests/**"
    #   - go.mod
    #   - go.sum
name: integration-tests

jobs:
  integration-tests:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        packages:
          [
            github.com/ChainSafe/gossamer/dot,
            github.com/ChainSafe/gossamer/dot/core,
            github.com/ChainSafe/gossamer/dot/rpc,
            github.com/ChainSafe/gossamer/dot/rpc/modules,
            github.com/ChainSafe/gossamer/dot/rpc/subscription,
            github.com/ChainSafe/gossamer/dot/state,
            github.com/ChainSafe/gossamer/dot/digest,
            github.com/ChainSafe/gossamer/dot/network,
            github.com/ChainSafe/gossamer/dot/sync,
            github.com/ChainSafe/gossamer/lib/babe,
            github.com/ChainSafe/gossamer/lib/grandpa,
          ]
    runs-on: buildjet-4vcpu-ubuntu-2204
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          all_but_latest: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.1"
          cache: true
          stable: true
          check-latest: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Go cache directories
        id: go-cache-dirs
        run: |
          echo "build=$(go env GOCACHE)" >> $GITHUB_OUTPUT
          echo "mod=$(go env GOMODCACHE)" >> $GITHUB_OUTPUT

      - name: Setup Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go-cache-dirs.outputs.build }}
            ${{ steps.go-cache-dirs.outputs.mod }}
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-build-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-build-
            ${{ runner.os }}-go-

      - name: Run integration tests
        env:
          CI: buildjet
          GOCACHE: ${{ steps.go-cache-dirs.outputs.build }}
        run: go test -count=1 -v -timeout=45m -tags integration ${{ matrix.packages }}
